kind = "mobile"
previewPath = "/"
title = "PatinCrono"
description = "App móvil de entrenamiento de patinaje de carrera con cronómetro de alta precisión, registro ilimitado de vueltas, estadísticas (mejor/peor vuelta, promedio, consistencia, velocidad), historial de sesiones, gráficas de evolución, modo oscuro, exportación CSV y almacenamiento local offline."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/"
